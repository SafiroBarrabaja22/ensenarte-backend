# Integracion continua del backend de enSEÑArte.
#
# En cada push y pull request: Python 3.12 + PostgreSQL, dependencias con cache,
# migraciones al dia, suite completa con cobertura minima de 70 % y reporte HTML
# descargable como artifact.
#
# Secrets requeridos (Settings -> Secrets and variables -> Actions):
#   CI_SECRET_KEY         Clave de Django solo para la CI (no la de produccion).
#   CI_POSTGRES_USER      Usuario del PostgreSQL temporal de la CI.
#   CI_POSTGRES_PASSWORD  Contrasena de ese usuario (solo letras y numeros: va en una URL).
#   CI_POSTGRES_DB        Nombre de la base.
# La base vive solo durante la ejecucion; ninguno de estos valores es de produccion.

name: CI

on:
  push:
    branches: ["**"]          # main y todas las ramas de trabajo
  pull_request:
    branches: ["**"]          # PR hacia main o hacia cualquier rama de trabajo

# Si llegan varios push seguidos a la misma rama/PR, solo sigue el ultimo.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas y cobertura (Python 3.12 + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ secrets.CI_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.CI_POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings_pruebas
      SECRET_KEY: ${{ secrets.CI_SECRET_KEY }}
      PRUEBAS_DATABASE_URL: postgres://${{ secrets.CI_POSTGRES_USER }}:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/${{ secrets.CI_POSTGRES_DB }}
      PYTHONIOENCODING: utf-8

    steps:
      - name: Verificar que los secrets existan
        env:
          TIENE_SECRET_KEY: ${{ secrets.CI_SECRET_KEY != '' }}
          TIENE_USUARIO: ${{ secrets.CI_POSTGRES_USER != '' }}
          TIENE_CLAVE: ${{ secrets.CI_POSTGRES_PASSWORD != '' }}
          TIENE_BASE: ${{ secrets.CI_POSTGRES_DB != '' }}
        run: |
          faltan=""
          [ "$TIENE_SECRET_KEY" = "true" ] || faltan="$faltan CI_SECRET_KEY"
          [ "$TIENE_USUARIO" = "true" ] || faltan="$faltan CI_POSTGRES_USER"
          [ "$TIENE_CLAVE" = "true" ] || faltan="$faltan CI_POSTGRES_PASSWORD"
          [ "$TIENE_BASE" = "true" ] || faltan="$faltan CI_POSTGRES_DB"
          if [ -n "$faltan" ]; then
            echo "::error::Faltan secrets del repositorio:$faltan. Ver README, seccion Integracion continua."
            exit 1
          fi

      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Python 3.12 (con cache de pip)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar librerias del sistema (mysqlclient se compila)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libmysqlclient-dev

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Revisar la configuracion de Django
        run: python manage.py check

      - name: Verificar que no haya migraciones sin generar
        run: python manage.py makemigrations --check --dry-run

      - name: Correr la suite con cobertura (minimo 70 %)
        # pytest.ini ya incluye --cov, el reporte HTML y --cov-fail-under=70.
        run: pytest

      - name: Publicar el reporte HTML de cobertura
        if: always()   # tambien cuando la cobertura no alcanza, para ver que falta
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura-html
          path: htmlcov/
          if-no-files-found: warn
          retention-days: 14
