# Integracion continua del backend de enSEÑArte.
#
# En cada push y pull request: Python 3.12, dependencias con cache, migraciones
# al dia, suite completa con cobertura minima de 70 % y reporte HTML descargable
# como artifact.
#
# Las pruebas corren sobre SQLite en memoria, igual que en local
# (config/settings_pruebas.py). Las de triggers y procedimientos almacenados
# solo corren contra MySQL y aqui se saltan: ver README, "Pruebas de las reglas
# en MySQL".
#
# Secret requerido (Settings -> Secrets and variables -> Actions):
#   CI_SECRET_KEY   Clave de Django solo para la CI (no la de produccion).

name: CI

on:
  push:
    branches: ["**"]          # main y todas las ramas de trabajo
  pull_request:
    branches: ["**"]          # PR hacia main o hacia cualquier rama de trabajo

# Si llegan varios push seguidos a la misma rama/PR, solo sigue el ultimo.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas y cobertura (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DJANGO_SETTINGS_MODULE: config.settings_pruebas
      SECRET_KEY: ${{ secrets.CI_SECRET_KEY }}
      PYTHONIOENCODING: utf-8

    steps:
      - name: Verificar que el secret exista
        env:
          TIENE_SECRET_KEY: ${{ secrets.CI_SECRET_KEY != '' }}
        run: |
          if [ "$TIENE_SECRET_KEY" != "true" ]; then
            echo "::error::Falta el secret CI_SECRET_KEY. Ver README, seccion Integracion continua."
            exit 1
          fi

      - name: Descargar el codigo
        uses: actions/checkout@v7

      - name: Instalar Python 3.12 (con cache de pip)
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Verificar que requirements-ci.txt este al dia
        # requirements-ci.txt fija TODAS las dependencias con su hash. Si alguien
        # cambia requirements.txt o requirements-dev.txt y no lo regenera, falla.
        run: python scripts/verificar_requirements_ci.py

      - name: Instalar dependencias (versiones exactas, con hash y sin compilar)
        # --require-hashes: pip rechaza cualquier paquete cuyo contenido no
        # coincida con el hash guardado (un paquete alterado no se instala).
        # --only-binary :all:: solo ruedas precompiladas; no se ejecuta ningun
        # setup.py durante la instalacion. mysqlclient no esta: no tiene rueda
        # para Linux y la CI usa SQLite.
        run: |
          python -m pip install --only-binary :all: --require-hashes -r requirements-ci.txt

      - name: Buscar vulnerabilidades conocidas en las dependencias
        # Revisa todo lo instalado (tambien las dependencias indirectas, como
        # sqlparse o asgiref) y, aparte, requirements.txt completo (incluye
        # mysqlclient). Falla si encuentra alguna: se arregla subiendo la version
        # (Dependabot abre esos PR cada semana) y regenerando requirements-ci.txt.
        run: |
          pip-audit --progress-spinner off --skip-editable
          pip-audit --progress-spinner off -r requirements.txt --no-deps --disable-pip

      - name: Revisar la configuracion de Django
        run: python manage.py check

      - name: Verificar que no haya migraciones sin generar
        run: python manage.py makemigrations --check --dry-run

      - name: Correr la suite con cobertura (minimo 70 %)
        # pytest.ini ya incluye --cov, el reporte HTML y --cov-fail-under=70.
        run: pytest

      - name: Publicar el reporte HTML de cobertura
        if: always()   # tambien cuando la cobertura no alcanza, para ver que falta
        uses: actions/upload-artifact@v7
        with:
          name: reporte-cobertura-html
          path: htmlcov/
          if-no-files-found: warn
          retention-days: 14
