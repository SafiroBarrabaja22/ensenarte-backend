{% comment %}Boton "a prueba de Outlook": celda con bgcolor + enlace con padding. Uso: {% include "correos/_boton.html" with url=... texto=... %}{% endcomment %}
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:24px 0 8px 0;">
  <tr>
    <td align="center" bgcolor="{{ c.teal }}" style="background-color:{{ c.teal }}; border-radius:8px;">
      <a href="{{ url }}" target="_blank" style="display:inline-block; padding:13px 22px; font-family:{{ c.fuente }}; font-size:15px; font-weight:bold; line-height:1.2; color:{{ c.blanco }}; text-decoration:none; border-radius:8px;">{{ texto }}</a>
    </td>
  </tr>
</table>
