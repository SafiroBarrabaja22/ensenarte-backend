[pytest]
DJANGO_SETTINGS_MODULE = config.settings_pruebas
python_files = tests.py tests_*.py test_*.py
testpaths = apps tests
addopts =
    --strict-markers
    --cov
    --cov-config=.coveragerc
    --cov-report=term-missing:skip-covered
    --cov-report=html
    --cov-fail-under=70
filterwarnings =
    ignore::DeprecationWarning:environ.*
